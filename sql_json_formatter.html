<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL / JSON Formatter</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net">

<style>
*{
    box-sizing:border-box;
    font-family:Consolas,"맑은 고딕",monospace;
}
body{
    margin:0;
    background:#1e1e1e;
    color:white;
}
.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}
h2{
    margin-bottom:15px;
}
.tabs{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}
button{
    background:#0d6efd;
    color:white;
    border:none;
    padding:10px 18px;
    cursor:pointer;
    border-radius:6px;
}
button:hover{
    background:#0b5ed7;
}
textarea{
    width:100%;
    height:650px;
    resize:vertical;
    background:#252526;
    color:#fff;
    border:1px solid #444;
    border-radius:6px;
    padding:15px;
    font-size:14px;
    line-height:1.5;
}
.actions{
    margin:15px 0;
    display:flex;
    gap:10px;
}
</style>
</head>
<body>

<div class="container">

<h2>SQL / JSON Formatter</h2>

<div class="tabs">
<button onclick="mode='sql'">SQL</button>
<button onclick="mode='json'">JSON</button>
</div>

<textarea id="text"></textarea>

<div class="actions">
<button onclick="formatText()">포맷팅</button>
<button onclick="copyText()">복사</button>
<button onclick="clearText()">초기화</button>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sql-formatter@15.6.0/dist/sql-formatter.min.js"></script>

<script>

let mode="sql";

function formatText(){

    let text=document.getElementById("text").value;

    try{

        if(mode==="sql"){

            text=sqlFormatter.format(text,{
                language:"plsql",
                keywordCase:"upper",
                tabWidth:4,
                linesBetweenQueries:2
            });

        }else{

            text=JSON.stringify(JSON.parse(text),null,4);

        }

        document.getElementById("text").value=text;

    }catch(e){
        alert(e.message);
    }

}

function copyText(){

    navigator.clipboard.writeText(
        document.getElementById("text").value
    );

}

function clearText(){

    document.getElementById("text").value="";

}

</script>

</body>
</html>

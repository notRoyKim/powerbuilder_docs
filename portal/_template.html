<!DOCTYPE html>
<html lang="ko">
<!--
  새 도구 템플릿
  1) 이 파일을 카테고리 폴더로 복사  (예: db/my-tool.html)
  2) assets/menu.js 의 해당 카테고리 items 에 { file: 'db/my-tool.html', name: '...', desc: '...' } 추가
  3) 아래 #form 안에 입력 UI, 스크립트에 로직 작성
  ※ 폴더 깊이가 1단계(카테고리/파일.html)면 경로는 "../assets/..." 그대로 두면 됩니다.
     루트에 둘 경우 "assets/..." 로 바꾸세요.
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새 도구</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../assets/portal.css">
</head>
<body>

<!-- 제목·설명·경로 표시는 menu.js 등록 내용으로 자동 생성됩니다 -->
<div id="form">
  <div class="card">
    <div class="card-title"><span class="step">1</span>입력</div>
    <div class="grid c2">
      <div class="field span-all">
        <label for="src">원본</label>
        <textarea id="src" rows="8"></textarea>
      </div>
      <div class="field">
        <label for="opt1">옵션</label>
        <input type="text" id="opt1">
      </div>
    </div>
    <div class="btn-row" style="margin-top:12px">
      <button type="button" class="btn primary" id="btnRun">실행</button>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-title">결과</div>
  <div class="code-wrap">
    <button type="button" class="btn sm" id="btnCopy">복사</button>
    <pre class="code" id="out"></pre>
  </div>
</div>

<script src="../assets/menu.js"></script>
<script src="../assets/layout.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  function run() {
    var result = $('src').value;           // TODO: 여기에 변환 로직
    $('out').innerHTML = Portal.highlightSql(result);
    $('out').dataset.raw = result;
  }

  $('btnRun').onclick = run;
  $('btnCopy').onclick = function () { Portal.copy($('out').dataset.raw || '', this); };
  Portal.persist($('form'));               // 입력값 자동 저장/복원
})();
</script>
</body>
</html>

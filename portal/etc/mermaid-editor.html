<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mermaid 에디터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../assets/portal.css">
<style>
  .fe-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 12px; }
  .fe-grp { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .fe-grp .seg label, .fe-dir label { padding: 5px 10px; font-size: 13px; }
  .fe-bar .spacer { flex: 1; }
  .fe-scroll { position: relative; overflow: auto; height: 560px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  #feSvg { display: block; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
  #feSvg.c-move { cursor: move; }
  #feSvg.c-link { cursor: crosshair; }
  #feSvg.c-edge { cursor: pointer; }
  .fe-grid { fill: none; stroke: var(--border); stroke-width: 1; opacity: .6; }
  .fe-node .fe-shape { fill: var(--accent-weak); stroke: var(--accent); stroke-width: 1.5; }
  .fe-node .fe-shape.fe-open { fill: none; }
  .fe-node.sel .fe-shape { stroke-width: 3; }
  .fe-node.drop .fe-shape { stroke: var(--ok); stroke-width: 3; }
  .fe-txt { font-size: 14px; fill: var(--text); text-anchor: middle; dominant-baseline: central; }
  .fe-edge line { fill: none; stroke: var(--text-2); stroke-width: 1.6; }
  .fe-edge.fe-dot line { stroke-dasharray: 5 4; }
  .fe-edge.fe-thick line { stroke-width: 3.2; }
  .fe-edge.sel line { stroke: var(--accent); }
  .fe-ah { fill: var(--text-2); }
  .fe-ah.on { fill: var(--accent); }
  .fe-lbg { fill: var(--surface); stroke: var(--border); }
  .fe-lbl { font-size: 13px; fill: var(--text-2); text-anchor: middle; dominant-baseline: central; }
  .fe-h { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
  .fe-temp { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .fe-empty { font-size: 14px; fill: var(--text-3); text-anchor: middle; }
  .fe-edit { position: absolute; display: none; z-index: 2; padding: 4px 6px; font: inherit; font-size: 14px; text-align: center; border: 1.5px solid var(--accent); border-radius: 4px; background: var(--surface); color: var(--text); outline: none; }
  .fe-measure { position: absolute; left: -9999px; top: 0; width: 0; height: 0; visibility: hidden; }
</style>
</head>
<body>

<div id="form">
  <div class="card">
    <div class="fe-bar">
      <div class="fe-grp">모양
        <div class="seg">
          <label><input type="radio" name="shape" value="rect" checked>사각형</label>
          <label><input type="radio" name="shape" value="round">둥근</label>
          <label><input type="radio" name="shape" value="stadium">시작·끝</label>
          <label><input type="radio" name="shape" value="diamond">조건</label>
          <label><input type="radio" name="shape" value="io">입출력</label>
          <label><input type="radio" name="shape" value="db">DB</label>
          <label><input type="radio" name="shape" value="circle">원</label>
        </div>
      </div>
      <div class="fe-grp">선
        <div class="seg">
          <label><input type="radio" name="edge" value="arrow" checked>화살표</label>
          <label><input type="radio" name="edge" value="dot">점선</label>
          <label><input type="radio" name="edge" value="thick">굵게</label>
          <label><input type="radio" name="edge" value="line">선만</label>
        </div>
      </div>
      <span class="spacer"></span>
      <div class="btn-row">
        <button type="button" class="btn sm" id="btnAdd">+ 노드</button>
        <button type="button" class="btn sm" id="btnDel">삭제</button>
        <button type="button" class="btn sm" id="btnUndo">되돌리기</button>
        <button type="button" class="btn sm" id="btnClear">새로 그리기</button>
      </div>
    </div>

    <div class="fe-scroll" id="feScroll">
      <svg id="feSvg" tabindex="0" xmlns="http://www.w3.org/2000/svg"></svg>
      <input type="text" class="fe-edit" spellcheck="false" aria-label="글자">
    </div>
    <svg class="fe-measure" aria-hidden="true"><text id="feMeasure" class="fe-txt"></text></svg>
    <div class="hint" style="margin-top:8px">
      빈 곳 더블클릭: 노드 추가 · 노드 테두리의 점을 끌어 다른 노드에 놓으면 연결, 빈 곳에 놓으면 이어진 새 노드 ·
      노드·선 더블클릭(또는 Enter): 글자 고치기 · 모양·선 버튼: 고른 노드·선을 바꿈(아무것도 안 고르면 새로 그릴 기본값) ·
      Delete: 삭제 · Ctrl+Z / Ctrl+Y: 되돌리기 / 다시
    </div>
  </div>

  <div class="card" id="outCard">
    <div class="card-title">
      Mermaid 코드
      <span class="spacer" style="flex:1"></span>
      <div class="seg fe-dir">
        <label><input type="radio" name="dir" value="TD" checked>위→아래</label>
        <label><input type="radio" name="dir" value="LR">왼쪽→오른쪽</label>
      </div>
    </div>
    <div class="code-wrap">
      <button type="button" class="btn sm" id="btnCopy">복사</button>
      <pre class="code" id="out"></pre>
    </div>
  </div>
</div>

<script src="../assets/menu.js"></script>
<script src="../assets/layout.js"></script>
<script src="mermaid-editor.js"></script>
</body>
</html>

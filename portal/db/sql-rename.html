<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쿼리 이름 바꾸기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../assets/portal.css">
<style>
  .card-title .spacer { flex: 1; }
  .card-title .hint { margin: 0; font-weight: 400; }
  .rn-scroll { max-height: 460px; }
  table.rn-map td { padding: 4px 10px; vertical-align: middle; }
  table.rn-map td.o { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
  table.rn-map tr.sub td.o { padding-left: 28px; }
  table.rn-map td.arrow { color: var(--text-3); width: 20px; padding: 0; text-align: center; }
  table.rn-map td.ty { color: var(--text-3); font-size: 12px; white-space: nowrap; width: 56px; }
  table.rn-map .n { color: var(--text-3); font-size: 12px; text-align: right; width: 48px; }
  table.rn-map input { padding: 4px 8px; font-family: var(--mono); font-size: 12.5px; }
  .rn-ctx { color: var(--text-3); font-family: var(--font); font-size: 11.5px; margin-left: 6px; }
  pre.code .rs { color: var(--code-fn); background: color-mix(in srgb, var(--code-fn) 14%, transparent); border-radius: 3px; }
  pre.code .left { text-decoration: underline wavy var(--danger); text-underline-offset: 3px; }
  #out { min-height: 120px; }
</style>
</head>
<body>

<div id="form">
  <div class="card">
    <div class="card-title"><span class="step">1</span>받은 쿼리</div>
    <textarea id="src" rows="12" spellcheck="false" placeholder="임시 이름(orders, customer_id 등)으로 작성된 쿼리를 그대로 붙여넣으세요."></textarea>
  </div>

  <div class="card">
    <div class="card-title"><span class="step">2</span>실제 이름 입력
      <span class="spacer"></span>
      <span class="hint" id="sum"></span>
      <button type="button" class="btn sm" id="btnForget">기억한 이름 지우기</button>
    </div>
    <div class="table-scroll rn-scroll">
      <table class="data rn-map">
        <thead><tr><th>받은 이름</th><th></th><th>실제 이름 (비우면 그대로)</th><th>종류</th><th class="n">횟수</th></tr></thead>
        <tbody id="mapBody"></tbody>
      </table>
    </div>
    <div class="hint" style="margin-top:6px">Enter·↓ 다음 칸, ↑ 이전 칸. 입력한 이름은 이 브라우저에 기억되어 같은 이름이 다시 나오면 자동으로 채워집니다.</div>
  </div>

  <div class="card">
    <div class="card-title"><span class="step">3</span>결과
      <span class="spacer"></span><span class="hint" id="outSum"></span>
    </div>
    <div class="code-wrap">
      <button type="button" class="btn sm" id="btnCopy">복사</button>
      <pre class="code" id="out"></pre>
    </div>
  </div>
</div>

<script src="../assets/menu.js"></script>
<script src="../assets/layout.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = Portal.esc;

  /* ================= 단어 목록 (sql-mask.html과 동일) ================= */
  function words(s) { var o = Object.create(null); s.trim().split(/\s+/).forEach(function (w) { o[w] = 1; }); return o; }

  // 그대로 두는 예약어·데이터타입·의사컬럼
  var KW = words(
    'SELECT FROM WHERE AND OR NOT IN IS NULL LIKE ESCAPE BETWEEN EXISTS ALL ANY SOME AS ON USING ' +
    'JOIN INNER LEFT RIGHT FULL OUTER CROSS NATURAL APPLY LATERAL GROUP BY HAVING ORDER ASC DESC NULLS FIRST LAST ' +
    'UNION INTERSECT MINUS EXCEPT DISTINCT UNIQUE TOP LIMIT OFFSET FETCH NEXT ROWS ROW ONLY PERCENT TIES ' +
    'WITH RECURSIVE CASE WHEN THEN ELSE END INSERT INTO VALUES UPDATE SET DELETE MERGE MATCHED TARGET SOURCE ' +
    'OUTPUT RETURNING CREATE ALTER DROP TRUNCATE RENAME TABLE VIEW INDEX SEQUENCE SYNONYM TRIGGER PROCEDURE ' +
    'FUNCTION PACKAGE BODY TEMPORARY GLOBAL MATERIALIZED PRIMARY FOREIGN KEY REFERENCES CONSTRAINT DEFAULT CHECK ' +
    'CASCADE RESTRICT ACTION ADD COLUMN MODIFY COMMENT GRANT REVOKE TO PUBLIC COMMIT ROLLBACK SAVEPOINT BEGIN TRAN ' +
    'TRANSACTION START CONNECT PRIOR NOCYCLE SIBLINGS LEVEL ROWNUM ROWID PARTITION OVER WITHIN RANGE PRECEDING ' +
    'FOLLOWING UNBOUNDED CURRENT PIVOT UNPIVOT FOR OF NOWAIT WAIT SKIP LOCKED NOLOCK READPAST UPDLOCK HOLDLOCK READ ' +
    'WRITE OPTION DUPLICATE IGNORE RESPECT DECLARE EXEC EXECUTE CALL RETURN RETURNS IF ELSIF ELSEIF WHILE LOOP CURSOR ' +
    'OPEN CLOSE EXIT IMMEDIATE BULK COLLECT FORALL TRUE FALSE DUAL SYSDATE SYSTIMESTAMP CURRENT_DATE CURRENT_TIMESTAMP ' +
    'CURRENT_TIME LOCALTIMESTAMP USER SESSION_USER SYSTEM_USER NEXTVAL CURRVAL SQLCA SQLSA SQLDA SQLCODE SQLERRM ' +
    'ROWCOUNT FOUND NOTFOUND ISOPEN ROWTYPE INTERVAL DAY MONTH YEAR HOUR MINUTE SECOND ZONE TIME TIMESTAMP DATE ' +
    'DATETIME DATETIME2 SMALLDATETIME VARCHAR VARCHAR2 NVARCHAR NVARCHAR2 CHAR NCHAR CHARACTER VARYING NUMBER NUMERIC ' +
    'DECIMAL DEC INT INTEGER BIGINT SMALLINT TINYINT FLOAT REAL DOUBLE PRECISION BIT BOOLEAN BOOL CLOB NCLOB BLOB ' +
    'TEXT NTEXT LONG RAW BINARY VARBINARY MONEY SERIAL JSONB COLLATE AT KEEP FILTER WINDOW EXPLAIN PLAN OUT INOUT ' +
    'NOCOPY CONTINUE GOTO BREAK PRINT RAISE RAISERROR THROW TRY CATCH IDENTITY AUTO_INCREMENT TABLESPACE NOLOGGING ' +
    'LOGGING PARALLEL ENABLE DISABLE ROLLUP CUBE GROUPING SETS SIBLINGS'
  );
  // 내장 함수 (뒤에 괄호가 올 때만 그대로 둠)
  var FN = words(
    'COUNT SUM AVG MIN MAX STDDEV VARIANCE MEDIAN NVL NVL2 DECODE COALESCE NULLIF ISNULL IFNULL IIF GREATEST LEAST ' +
    'CAST CONVERT TRY_CAST TRY_CONVERT TO_CHAR TO_DATE TO_NUMBER TO_TIMESTAMP TO_CLOB TO_NCHAR SUBSTR SUBSTRB SUBSTRING ' +
    'INSTR INSTRB CHARINDEX PATINDEX LENGTH LENGTHB LEN DATALENGTH UPPER LOWER INITCAP TRIM LTRIM RTRIM LPAD RPAD ' +
    'REPLACE TRANSLATE STUFF CONCAT CONCAT_WS LEFT RIGHT REVERSE REPLICATE SPACE ASCII CHR CHAR NCHR UNISTR ROUND TRUNC ' +
    'TRUNCATE CEIL CEILING FLOOR ABS MOD SIGN POWER SQRT EXP LN LOG RAND RANDOM ADD_MONTHS MONTHS_BETWEEN LAST_DAY ' +
    'NEXT_DAY EXTRACT DATEADD DATEDIFF DATEPART DATENAME GETDATE SYSDATETIME GETUTCDATE EOMONTH NOW CURDATE CURTIME ' +
    'DATE_FORMAT STR_TO_DATE DATE_ADD DATE_SUB DATE_TRUNC DATE_PART AGE FORMAT YEAR MONTH DAY ROW_NUMBER RANK ' +
    'DENSE_RANK NTILE LAG LEAD FIRST_VALUE LAST_VALUE NTH_VALUE CUME_DIST PERCENT_RANK RATIO_TO_REPORT LISTAGG ' +
    'STRING_AGG GROUP_CONCAT XMLAGG XMLELEMENT XMLPARSE ARRAY_AGG JSON_VALUE JSON_QUERY JSON_OBJECT JSON_ARRAY ' +
    'REGEXP_LIKE REGEXP_SUBSTR REGEXP_REPLACE REGEXP_INSTR REGEXP_COUNT SYS_GUID NEWID UUID SYS_CONTEXT USERENV ' +
    'NUMTODSINTERVAL NUMTOYMINTERVAL OBJECT_ID OBJECT_NAME SCOPE_IDENTITY IDENT_CURRENT HASHBYTES STANDARD_HASH ' +
    'ORA_HASH GENERATE_SERIES UNNEST GROUPING WIDTH_BUCKET BITAND CHOOSE ISNUMERIC ISDATE TRY_PARSE PARSE QUOTENAME ' +
    'SOUNDEX UNICODE EMPTY_CLOB EMPTY_BLOB TABLE VALUES'
  );
  var SYS_PKG = /^(DBMS_|UTL_|APEX_|OWA_|HTP$|SYS$)/;

  var TYPE_NAME = { table: '테이블', schema: '스키마', col: '컬럼', func: '함수' };
  var PRIORITY = { table: 0, schema: 1, alias: 2, func: 3, col: 4 };
  var ID_START = /[\p{L}_]/u, ID_CHAR = /[\p{L}\p{N}_$#]/u;

  /* ================= 토큰 분리 (sql-mask.html과 동일) ================= */
  function tokenize(s) {
    var out = [], i = 0, n = s.length, j, c, d, m;
    var NUM = /\d*\.?\d+(?:[eE][+-]?\d+)?/y;
    function push(k, v, x) { x = x || {}; x.k = k; x.v = v; out.push(x); }
    while (i < n) {
      c = s[i]; d = s[i + 1];
      if (/\s/.test(c)) { j = i + 1; while (j < n && /\s/.test(s[j])) j++; push('ws', s.slice(i, j)); i = j; continue; }
      if (c === '-' && d === '-') { j = s.indexOf('\n', i); if (j < 0) j = n; push('cm', s.slice(i, j)); i = j; continue; }
      if (c === '/' && d === '*') {
        j = s.indexOf('*/', i + 2); j = j < 0 ? n : j + 2;
        var cv = s.slice(i, j); push(cv[2] === '+' ? 'hint' : 'cm', cv); i = j; continue;
      }
      // 문자열 (N'..', E'..' 포함)
      var pre = '';
      if (/[NnEe]/.test(c) && d === "'" && !(i > 0 && ID_CHAR.test(s[i - 1]))) { pre = c; }
      if (c === "'" || pre) {
        var q0 = i + pre.length; j = q0 + 1; var closed = false;
        while (j < n) {
          if (s[j] === "'") { if (s[j + 1] === "'") { j += 2; continue; } closed = true; j++; break; }
          j++;
        }
        push('str', s.slice(i, j), { pre: pre, body: s.slice(q0 + 1, closed ? j - 1 : j), closed: closed });
        i = j; continue;
      }
      // 따옴표 식별자 "x" [x] `x`
      if (c === '"' || c === '`' || c === '[') {
        var qc = c === '[' ? ']' : c; j = i + 1;
        while (j < n) {
          if (s[j] === qc) { if (qc !== ']' && s[j + 1] === qc) { j += 2; continue; } break; }
          if (s[j] === '\n') { j = n; break; }
          j++;
        }
        var nm = j < n ? s.slice(i + 1, j) : '';
        if (nm && /[\p{L}_]/u.test(nm[0])) { push('qid', s.slice(i, j + 1), { q: c, qc: qc, name: nm }); i = j + 1; continue; }
        push('op', c); i++; continue;
      }
      // 바인드 변수
      if (c === ':') {
        if (d === ':' || d === '=') { push('op', c + d); i += 2; continue; }
        if (d && ID_START.test(d)) {
          j = i + 2; while (j < n && ID_CHAR.test(s[j])) j++;
          push('var', s.slice(i, j), { pre: ':', name: s.slice(i + 1, j), post: '' }); i = j; continue;
        }
      }
      if (c === '@') {
        if (d === '@') { j = i + 2; while (j < n && ID_CHAR.test(s[j])) j++; push('sys', s.slice(i, j)); i = j; continue; }
        if (d && ID_START.test(d) && !(i > 0 && ID_CHAR.test(s[i - 1]))) {
          j = i + 2; while (j < n && ID_CHAR.test(s[j])) j++;
          push('var', s.slice(i, j), { pre: '@', name: s.slice(i + 1, j), post: '' }); i = j; continue;
        }
      }
      if ((c === '#' || c === '$') && d === '{') {
        j = s.indexOf('}', i + 2);
        if (j > 0) {
          m = s.slice(i + 2, j).match(/^(\s*)([\p{L}_][\p{L}\p{N}_.]*)([\s\S]*)$/u);
          if (m) { push('var', s.slice(i, j + 1), { pre: c + '{' + m[1], name: m[2], post: m[3] + '}' }); i = j + 1; continue; }
        }
      }
      if (/\d/.test(c) || (c === '.' && d && /\d/.test(d))) {
        NUM.lastIndex = i; m = NUM.exec(s); j = i + (m ? m[0].length : 1);
        push('num', s.slice(i, j)); i = j; continue;
      }
      if (ID_START.test(c) || (c === '#' && d && ID_START.test(d))) {
        j = i + 1; while (j < n && ID_CHAR.test(s[j])) j++;
        push('id', s.slice(i, j)); i = j; continue;
      }
      push('op', c); i++;
    }
    return out;
  }

  /* ================= 쿼리 분석 =================
   * sql-mask의 analyze 기반. 다른 점:
   *  - 별칭이 가리키는 테이블을 기억해 o.ID / c.ID 를 'ORDERS.ID' / 'CUSTOMERS.ID' 로 구분
   *  - 테이블이 하나뿐인 쿼리의 맨 컬럼은 그 테이블 컬럼으로 봄
   *  - AS 뒤 결과 별칭, 테이블 별칭, 바인드 변수, 문자열은 목록에서 뺌
   */
  function analyze(toks) {
    var sig = [];
    toks.forEach(function (t, i) { if (t.k !== 'ws' && t.k !== 'cm' && t.k !== 'hint') sig.push(i); });
    var T = function (p) { return p >= 0 && p < sig.length ? toks[sig[p]] : null; };
    var U = function (t) { return t && t.k === 'id' ? t.v.toUpperCase() : ''; };
    var isWord = function (t) { return !!t && (t.k === 'id' || t.k === 'qid'); };
    var isKw = function (t) { return !!t && t.k === 'id' && !!KW[t.v.toUpperCase()]; };
    var isOp = function (t, v) { return !!t && t.k === 'op' && t.v === v; };
    var keyOf = function (t) { return (t.k === 'qid' ? t.name : t.v).toUpperCase(); };
    var nameOf = function (t) { return t.k === 'qid' ? t.name : t.v; };

    function chain(p) {
      var parts = [p], q = p, star = false;
      while (isOp(T(q + 1), '.')) {
        if (isWord(T(q + 2))) { q += 2; parts.push(q); }
        else { if (isOp(T(q + 2), '*')) { star = true; q += 2; } break; }
      }
      return { parts: parts, star: star, end: q + 1 };
    }

    // --- 1차: 테이블 · 별칭 찾기 ---
    var role = {}, tables = Object.create(null), aliases = Object.create(null), aliasOf = Object.create(null);
    var st = 'none', inFrom = false, stack = [], lastTable = null, p, t, u;
    for (p = 0; p < sig.length;) {
      t = T(p); u = U(t);
      if (isOp(t, '(')) {
        var pv = T(p - 1);
        var fn = !!pv && ((pv.k === 'id' && (!KW[U(pv)] || !!FN[U(pv)])) || pv.k === 'qid');
        var saved = st;
        if (st === 'cteName' && U(pv) === 'AS') saved = 'cteBody';
        stack.push({ fn: fn, st: saved, inFrom: inFrom });
        st = 'none'; inFrom = false; p++; continue;
      }
      if (isOp(t, ')')) {
        var fr = stack.pop() || { st: 'none', inFrom: false };
        if (fr.st === 'expect') lastTable = null;          // (서브쿼리) 뒤 별칭은 테이블 없음
        st = fr.st === 'expect' ? 'after' : fr.st === 'cteBody' ? 'afterCte' : fr.st;
        inFrom = fr.inFrom; p++; continue;
      }
      if (isOp(t, ';')) { st = 'none'; inFrom = false; stack = []; p++; continue; }
      if (isOp(t, ',')) {
        if ((st === 'after' || st === 'after2') && inFrom) st = 'expect';
        else if (st === 'afterCte') st = 'cte';
        else { st = 'none'; }
        p++; continue;
      }
      if (isKw(t)) {
        var pu = U(T(p - 1)), top = stack[stack.length - 1], nx = T(p + 1);
        if (u === 'FROM') { st = top && top.fn ? 'none' : 'expect'; inFrom = st === 'expect'; }
        else if (u === 'JOIN') { st = 'expect'; inFrom = true; }
        else if (u === 'INTO' || u === 'TABLE' || u === 'USING') { st = 'expect'; inFrom = false; }
        else if (u === 'DELETE') { st = pu === 'ON' ? 'none' : 'expect'; inFrom = false; }
        else if (u === 'UPDATE') { st = (pu === 'KEY' || pu === 'THEN' || pu === 'FOR' || pu === 'ON') ? 'none' : 'expect'; inFrom = false; }
        else if (u === 'WITH') {
          if (!isOp(nx, '(')) { st = (pu !== 'START' && isWord(nx)) ? 'cte' : 'none'; inFrom = false; }
        }
        else if (u === 'RECURSIVE' && st === 'cte') { /* 그대로 */ }
        else if (u === 'AS') { /* 별칭 앞 AS: 상태 유지 */ }
        else if ((u === 'ONLY' || u === 'LATERAL') && st === 'expect') { /* 그대로 */ }
        else { st = 'none'; inFrom = false; }
        p++; continue;
      }
      if (isWord(t)) {
        var ch = chain(p), last = ch.parts[ch.parts.length - 1];
        if (st === 'expect' && !ch.star) {
          ch.parts.forEach(function (q) { role[q] = q === last ? 'table' : 'schema'; });
          lastTable = keyOf(T(last));
          if (!tables[lastTable]) tables[lastTable] = nameOf(T(last));
          st = 'after';
        } else if (st === 'after' && ch.parts.length === 1 && !ch.star) {
          role[p] = 'alias'; aliases[keyOf(t)] = 1;
          if (lastTable) aliasOf[keyOf(t)] = lastTable;
          st = 'after2';
        } else if (st === 'cte' && ch.parts.length === 1) {
          role[p] = 'table'; if (!tables[keyOf(t)]) tables[keyOf(t)] = nameOf(t); st = 'cteName';
        } else st = 'none';
        p = ch.end; continue;
      }
      st = 'none'; p++;
    }

    // AS 뒤 결과 별칭 (SUM(x) AS total_amt) — 나중에 ORDER BY total_amt 로 다시 나와도 목록에서 뺌
    var outAlias = Object.create(null);
    for (p = 0; p < sig.length; p++) {
      if (U(T(p)) === 'AS' && isWord(T(p + 1)) && !isKw(T(p + 1)) && !role[p + 1] && !isOp(T(p + 2), '(') && !isOp(T(p + 2), '.')) {
        outAlias[keyOf(T(p + 1))] = 1;
      }
    }

    // --- 2차: 이름 분류 ---
    var tableKeys = Object.keys(tables);
    var only = tableKeys.length === 1 ? tableKeys[0] : null;
    var items = {}, found = Object.create(null), order = [];
    function add(ti, key, orig, type, tkey) {
      items[ti] = key;
      var f = found[key];
      if (!f) { f = found[key] = { key: key, o: orig, type: type, tkey: tkey || '', n: 0, first: order.length }; order.push(f); }
      else if (PRIORITY[type] < PRIORITY[f.type]) f.type = type;
      f.n++;
    }
    for (p = 0; p < sig.length;) {
      t = T(p);
      if (!isWord(t)) { p++; continue; }
      var c2 = chain(p), n = c2.parts.length, call = isOp(T(c2.end), '(') && !c2.star;
      var sysPkg = call && n > 1 && SYS_PKG.test(keyOf(T(c2.parts[0])));
      var types = [], k, q, tk, ku, ty;
      for (k = 0; k < n; k++) {
        q = c2.parts[k]; tk = T(q); ku = keyOf(tk); ty = null;
        if (sysPkg) ty = null;
        else if (role[q]) ty = role[q];
        else if (tk.k === 'id' && KW[ku]) ty = null;
        else if (call && k === n - 1) ty = (n === 1 && tk.k === 'id' && FN[ku]) ? null : 'func';
        else if (call) ty = 'func';
        else {
          var depth = c2.star ? n - k : n - 1 - k;
          if (depth === 0) ty = n === 1 ? (tables[ku] ? 'table' : aliases[ku] ? 'alias' : outAlias[ku] ? null : 'col') : 'col';
          else if (depth === 1) {
            var au = U(T(c2.parts[k + 1]));
            if (tables[ku]) ty = 'table';
            else if (aliases[ku]) ty = 'alias';
            else if (au === 'NEXTVAL' || au === 'CURRVAL') ty = 'table';
            else ty = ku.length <= 3 ? 'alias' : 'table';
          } else ty = 'schema';
        }
        if (ty === 'schema' && ku === 'DBO') ty = null;
        types.push(ty);
      }
      for (k = 0; k < n; k++) {
        ty = types[k];
        if (!ty || ty === 'alias') continue;
        q = c2.parts[k]; tk = T(q); ku = keyOf(tk);
        var key = ku, tkey = '';
        if (ty === 'col') {
          if (k === 0) tkey = only || '';
          else {
            var qk = keyOf(T(c2.parts[k - 1]));
            tkey = types[k - 1] === 'table' ? qk : (aliasOf[qk] || '');
          }
          if (tkey) key = tkey + '.' + ku;
        }
        add(sig[q], key, nameOf(tk), ty, tkey);
      }
      p = c2.end;
    }
    return { items: items, order: order, multi: tableKeys.length > 1 };
  }

  /* ================= 상태 ================= */
  var dict = Portal.store.get('dict', {}) || {};      // { 받은이름키: 실제이름 }
  var cur = { toks: [], items: {}, order: [], multi: false };

  // 표 순서: 테이블 → 그 테이블 컬럼 → 테이블 모르는 컬럼 → 스키마·함수
  function sortRows(order) {
    var rows = [], used = Object.create(null);
    var push = function (f) { if (!used[f.key]) { used[f.key] = 1; rows.push(f); } };
    order.forEach(function (tf) {
      if (tf.type !== 'table') return;
      push(tf);
      order.forEach(function (f) { if (f.type === 'col' && f.tkey === tf.key) push(f); });
    });
    order.forEach(function (f) { if (f.type === 'col') push(f); });
    order.forEach(push);
    return rows;
  }

  /* ================= 화면 ================= */
  function renderTable() {
    var rows = sortRows(cur.order);
    $('mapBody').innerHTML = rows.length ? rows.map(function (f) {
      var sub = f.type === 'col' && f.tkey;
      var label = esc(f.o) + (f.type === 'func' ? '()' : '') +
        (f.type === 'col' && !f.tkey && cur.multi ? '<span class="rn-ctx">테이블 모름</span>' : '');
      return '<tr' + (sub ? ' class="sub"' : '') + '><td class="o">' + label + '</td><td class="arrow">→</td>' +
        '<td><input type="text" data-k="' + esc(f.key) + '" value="' + esc(dict[f.key] || '') + '" placeholder="' + esc(f.o) +
        '" spellcheck="false" autocomplete="off"></td>' +
        '<td class="ty">' + TYPE_NAME[f.type] + '</td><td class="n">' + f.n + '</td></tr>';
    }).join('') : '<tr><td colspan="5" class="hint">쿼리를 붙여넣으면 바꿀 이름이 여기에 나옵니다.</td></tr>';
  }

  function renderOut() {
    var raw = '', html = '', left = Object.create(null), nLeft = 0;
    cur.toks.forEach(function (t, i) {
      var key = cur.items[i];
      if (key != null) {
        var real = dict[key];
        if (real) {
          var txt = t.k === 'qid' ? t.q + real + t.qc : real;
          raw += txt;
          html += '<span class="rs" title="받은 이름: ' + esc(t.k === 'qid' ? t.name : t.v) + '">' + esc(txt) + '</span>';
        } else {
          if (!left[key]) { left[key] = 1; nLeft++; }
          raw += t.v;
          html += '<span class="left">' + esc(t.v) + '</span>';
        }
        return;
      }
      raw += t.v;
      var c = t.k === 'cm' || t.k === 'hint' ? 'cm' : t.k === 'str' ? 'str' : '';
      if (t.k === 'id') { var u = t.v.toUpperCase(); c = KW[u] ? 'kw' : FN[u] ? 'fn' : ''; }
      html += c ? '<span class="' + c + '">' + esc(t.v) + '</span>' : esc(t.v);
    });
    $('out').innerHTML = raw.trim() ? html : '<span class="cm">-- 쿼리를 붙여넣으면 여기에 표시됩니다.</span>';
    $('out').dataset.raw = raw;

    var total = cur.order.length;
    $('sum').textContent = total ? '이름 ' + total + '개 · 입력 ' + (total - nLeft) + '개' : '';
    $('outSum').textContent = !total ? '' : nLeft ? '안 바꾼 이름 ' + nLeft + '개 (물결 밑줄)' : '모두 바꿨습니다';
  }

  function run() {
    // 채팅에서 복사하며 딸려 온 ```sql 줄은 버림
    var text = $('src').value.replace(/^[ \t]*```[\w-]*[ \t]*(?:\r?\n|$)/gm, '');
    cur.toks = tokenize(text);
    var r = analyze(cur.toks);
    cur.items = r.items; cur.order = r.order; cur.multi = r.multi;
    renderTable();
    renderOut();
  }

  /* ================= 이벤트 ================= */
  var timer;
  $('src').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(run, 150); });

  var body = $('mapBody');
  body.addEventListener('input', function (e) {
    var k = e.target.dataset.k;
    if (k == null) return;
    var v = e.target.value.trim();
    if (v) dict[k] = v; else delete dict[k];
    Portal.store.set('dict', dict);
    renderOut();
  });
  body.addEventListener('keydown', function (e) {
    if (e.target.dataset.k == null) return;
    var ins = Array.prototype.slice.call(body.querySelectorAll('input')), i = ins.indexOf(e.target), to;
    if (e.key === 'Enter' || e.key === 'ArrowDown') to = i + 1;
    else if (e.key === 'ArrowUp') to = i - 1;
    else return;
    e.preventDefault();
    if (ins[to]) { ins[to].focus(); ins[to].select(); }
  });

  $('btnForget').onclick = function () {
    var n = Object.keys(dict).length;
    if (!n) return;
    if (!confirm('기억한 이름 ' + n + '개를 모두 지울까요?')) return;
    dict = {};
    Portal.store.set('dict', dict);
    renderTable();
    renderOut();
  };
  $('btnCopy').onclick = function () { Portal.copy($('out').dataset.raw || '', this); };

  Portal.persist($('form'));
  run();
})();
</script>
</body>
</html>
